x-runtime: &runtime
  build: .
  image: cyber-rss-reader:local
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp
  volumes:
    - runtime:/runtime
  environment:
    CYBER_RSS_ALERT_CONFIG: ${CYBER_RSS_ALERT_CONFIG:-}
    CYBER_RSS_WEBHOOK_URL: ${CYBER_RSS_WEBHOOK_URL:-}
    CYBER_RSS_WEBHOOK_TOKEN: ${CYBER_RSS_WEBHOOK_TOKEN:-}
    CYBER_RSS_TELEGRAM_TOKEN: ${CYBER_RSS_TELEGRAM_TOKEN:-}
    CYBER_RSS_TELEGRAM_CHAT_ID: ${CYBER_RSS_TELEGRAM_CHAT_ID:-}
    CYBER_RSS_RETENTION_DAYS: ${CYBER_RSS_RETENTION_DAYS:-0}
    CYBER_RSS_RETENTION_MAX_ARTICLES: ${CYBER_RSS_RETENTION_MAX_ARTICLES:-0}
    CYBER_RSS_DATABASE_URL_FILE: /run/secrets/database_url
  secrets:
    - database_url

services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rss
      POSTGRES_DB: rss
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rss -d rss']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    <<: *runtime
    ports:
      - '127.0.0.1:${CYBER_RSS_WEB_PORT:-8001}:8000'
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).close()']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  worker:
    <<: *runtime
    command: [python, -m, app.worker, --interval, '21600']
    depends_on:
      api:
        condition: service_healthy

secrets:
  database_password:
    file: ${CYBER_RSS_POSTGRES_PASSWORD_FILE:?Set the PostgreSQL password file}
  database_url:
    file: ${CYBER_RSS_DATABASE_URL_FILE:?Set the PostgreSQL connection URL file}

volumes:
  runtime:
  postgres:
