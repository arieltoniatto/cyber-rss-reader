# Workload Identity: pods act as the Google service account below, which is
# also the Cloud SQL IAM database user. No key files are mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: cyber-rss
  name: cyber-rss
  annotations:
    iam.gke.io/gcp-service-account: cyber-rss@REPLACE_PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
