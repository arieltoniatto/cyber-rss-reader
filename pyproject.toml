[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "cyber-rss-reader"
version = "0.1.0"
description = "Terminal-based cybersecurity RSS and threat intelligence reader"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser",
    "httpx",
    "pydantic>=2,<3",
    "python-dateutil",
    "PyYAML",
    "rapidfuzz",
    "rich",
    "scikit-learn",
    "typer",
]


[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
browser = ["playwright>=1.50,<2"]

dev = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "build",
    "pytest",
    "pytest-asyncio",
]


[project.scripts]
rss = "app.main:main"
rss-api = "web_api.app:main"
rss-worker = "app.worker:main"
rss-import-json = "tools.import_json_cache:main"
rss-import-postgres = "tools.import_postgres:main"
rss-backup = "tools.backup_database:main"
rss-restore = "tools.restore_database:main"
rss-retention = "tools.retention:main"
rss-retag = "tools.retag_articles:main"
rss-alerts = "tools.alerts:main"
rss-migrate = "tools.migrate_database:main"
rss-update-actors = "tools.update_threat_actor_catalog:main"
rss-update-misp = "tools.update_misp_galaxy:main"
rss-update-attack = "tools.update_attack_catalog:main"
rss-update-malware = "tools.update_malware_catalog:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
web_api = ["static/*.html", "static/*.css", "static/*.js", "static/images/*.png", "static/fonts/*.ttf", "static/fonts/*.txt"]
config = [
    "feeds/*.yaml",
    "feeds/*.yml",
    "catalogs/*.json",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
]
asyncio_mode = "strict"
markers = [
    "integration: tests that access external services over the network",
    "postgres: tests using a dedicated PostgreSQL database",
]
